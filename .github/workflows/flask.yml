name: Flask CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flask-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          # Hosted CI has no GPU; avoid downloading the CUDA runtime.
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r backend/requirements.txt
          python -m pip check
      - name: Check audio CLI imports without downloading model weights
        run: python -m demucs --help
      - name: Run Flask and audio smoke tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
